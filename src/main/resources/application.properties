# ============================================================
# DATASOURCE — Neon PostgreSQL
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-quiet-math-aqi5q9u2-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_2hTsGOPUz1Ef}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# ============================================================
# JPA / HIBERNATE
# ============================================================
# Hibernate detecta PostgreSQL automáticamente desde la conexión
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ============================================================
# FLYWAY — Migraciones versionadas
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET:7A25432646294A404E635266556A586E3272357538782F413F4428472B4B6250}
jwt.expiration-ms=86400000

# ============================================================
# CACHE (Caffeine)
# ============================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=30s

# ============================================================
# SCHEDULER
# ============================================================
spring.task.scheduling.pool.size=2

# ============================================================
# CORS (ajustar en producción)
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
# LOGGING
# ============================================================
logging.level.com.prestamos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# SERVER
# ============================================================
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json
server.error.include-message=never

# ============================================================
# JPA BATCH INSERTS
# ============================================================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# FLYWAY EXTRA
# ============================================================
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ============================================================
# MULTIPART
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# ASYNC (para notificaciones futuras)
# ============================================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
